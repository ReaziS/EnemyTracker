# Release: push a tag "v<version>" matching "## Version:" in the .toc.
#   git tag v0.4.0 && git push origin v0.4.0
# Builds the zip, attaches it to a GitHub release and, when configured,
# uploads it to CurseForge so the CurseForge app updates it for everyone.
#
# CurseForge setup (once, in the GitHub repository settings):
#   Secrets and variables > Actions > Secrets:   CF_API_KEY    (curseforge.com/account/api-tokens)
#   Secrets and variables > Actions > Variables: CF_PROJECT_ID (number on the project page, "Project ID")
# Without them the release is only published on GitHub.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the .toc version
        run: |
          version=$(sed -n 's/^## Version: *//p' EnemyTracker.toc | tr -d '\r')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match .toc version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq luajit
          luajit tests/run_tests.lua

      - name: Build the zip
        run: bash tools/package.sh

      - name: Publish on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/EnemyTracker-$VERSION.zip" \
            --title "Enemy Tracker $VERSION" --notes-file "dist/CHANGELOG-$VERSION.md"

      - name: Upload to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
        run: |
          if [ -z "$CF_API_KEY" ] || [ -z "$CF_PROJECT_ID" ]; then
            echo "CF_API_KEY or CF_PROJECT_ID not set: skipping CurseForge"
            exit 0
          fi
          # Interface 16001 -> game version "1.60.1" (Forever).
          iface=$(sed -n 's/^## Interface: *//p' EnemyTracker.toc | tr -d '\r')
          gv="$((iface / 10000)).$((iface / 100 % 100)).$((iface % 100))"
          ids=$(curl -sSf -H "X-Api-Token: $CF_API_KEY" https://wow.curseforge.com/api/game/versions \
            | jq -c --arg n "$gv" '[.[] | select(.name == $n) | .id]')
          if [ "$ids" = "[]" ]; then
            echo "CurseForge has no game version $gv (interface $iface)" >&2
            exit 1
          fi
          case "$VERSION" in
            *alpha*) type=alpha ;;
            *beta*) type=beta ;;
            *) type=release ;;
          esac
          meta=$(jq -n --rawfile cl "dist/CHANGELOG-$VERSION.md" --arg dn "Enemy Tracker $VERSION" \
            --argjson gv "$ids" --arg rt "$type" \
            '{changelog: $cl, changelogType: "markdown", displayName: $dn, gameVersions: $gv, releaseType: $rt}')
          curl -sSf -H "X-Api-Token: $CF_API_KEY" \
            --form-string "metadata=$meta" \
            -F "file=@dist/EnemyTracker-$VERSION.zip" \
            "https://wow.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file"
          echo
          echo "Uploaded to CurseForge for game version $gv"
